name: dotfiles-grafana
services:
  grafana:
    cpus: "1.0"
    mem_limit: 384m
    image: docker.io/grafana/grafana:13.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Run terraform apply first}
      # Local-only service: disable telemetry/update checks.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Renders Langfuse's ClickHouse trace data (see terraform/local/
      # langfuse_grafana.tf). Officially signed, so no
      # GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS needed. SYNC, not the
      # deprecated GF_INSTALL_PLUGINS or async GF_PLUGINS_PREINSTALL: `docker
      # compose up --wait` must not pass its healthcheck before the plugin
      # finishes installing.
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.21.2
    ports:
      - 127.0.0.1:3001:3000
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  grafana_data:
    driver: local

networks:
  default:
    external: true
    name: dotfiles-o11y
