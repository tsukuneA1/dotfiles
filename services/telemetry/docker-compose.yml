name: dotfiles-telemetry
services:
  collector:
    cpus: "1.0"
    mem_limit: 256m
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    user: "0:0"
    command: ["--config=/etc/otelcol/config.yml"]
    environment:
      LANGFUSE_AUTH: ${LANGFUSE_AUTH:?Run terraform apply first}
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./collector.yml:/etc/otelcol/config.yml:ro
      - collector_queue:/var/lib/otelcol
    depends_on:
      loki:
        condition: service_started
  loki:
    cpus: "1.0"
    mem_limit: 256m
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    # This image is distroless. Readiness is verified through the Grafana proxy
    # and the end-to-end smoke test; the Collector retries during startup.
volumes:
  collector_queue:
  loki_data:
networks:
  default:
    external: true
    name: dotfiles-o11y
