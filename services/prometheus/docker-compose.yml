name: dotfiles-prometheus
services:
  prometheus:
    cpus: "1.0"
    mem_limit: 256m
    image: docker.io/prom/prometheus:v3.14.0
    restart: unless-stopped
    # The image's default args plus the OTLP receiver
    # (/api/v1/otlp/v1/metrics), which Claude Code pushes its metrics to —
    # see the otlp section in prometheus.yml. created-timestamp-zero-ingestion
    # writes a 0 at each counter's OTLP start time: every Claude Code session
    # is a new series whose first sample is already non-zero, and without the
    # 0 that first increment is invisible to increase()/max-min queries.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
      - --enable-feature=created-timestamp-zero-ingestion
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      # 9095, not 9090: 9090 is taken by langfuse's minio (S3 API). Container
      # port stays the default 9090.
      - 127.0.0.1:9095:9090
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  prometheus_data:
    driver: local

networks:
  default:
    external: true
    name: dotfiles-o11y
